<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Streaming Admin</title>

  <style>
    :root{
      --bg0:#070A16; --bg1:#0B1026; --bg2:#0E173A;
      --line: rgba(255,255,255,.10);
      --txt:#F6F8FF; --muted:#B5C0FF;
      --red:#ff3b5f; --green:#18c964; --yellow:#f5b301;
      --cyan:#23d5f2; --blue:#4f8cff; --purple:#b094ff;
      --shadow: 0 20px 70px rgba(0,0,0,.55);
      --shadow2: 0 10px 30px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family: system-ui, -apple-system, sans-serif;}
    body{
      color:var(--txt);
      background: radial-gradient(900px 520px at 12% 8%, rgba(79,140,255,.22), transparent 60%),
                  linear-gradient(180deg, var(--bg0), var(--bg1) 40%, var(--bg2));
      background-attachment: fixed;
    }
    .wrap{max-width:1400px;margin:0 auto;padding:22px 18px 70px}
    .topbar{ display:flex;align-items:center;justify-content:space-between; gap:14px;flex-wrap:wrap; margin-bottom:18px; }
    .brand{display:flex;align-items:center;gap:14px;}
    .logo{ width:50px;height:50px;border-radius:18px; display:grid;place-items:center; font-weight:1000; background: linear-gradient(135deg, var(--blue), var(--purple)); border:1px solid var(--line); }
    .title h1{margin:0;font-size:22px;line-height:1}
    .title .sub{margin:0;color:var(--muted);font-size:12px}
    
    .top-actions{ display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end; }
    .k{font-size:12px;color:var(--muted);margin-bottom:6px}
    .input, select{ width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background: rgba(10,14,35,.65); color:var(--txt); outline:none; }
    
    .btn{ border:0;cursor:pointer; padding:12px 16px; border-radius:14px; font-weight:900; color:#06101a; background: linear-gradient(135deg, var(--cyan), var(--blue)); transition:.12s; white-space:nowrap; }
    .btn-outline{ color:var(--txt); background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
    .btn-purple{ background: linear-gradient(135deg, var(--purple), #8a63ff); color: white; }
    
    .kpis{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-bottom:18px; }
    .kpi{ background: rgba(12,16,35,.62); border:1px solid var(--line); border-radius: 22px; padding: 22px 18px; text-align:center; backdrop-filter: blur(16px); }
    .kpi .n{ font-size:44px; font-weight:1000; margin:0; }
    .kpi .lbl{ color: var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1.4px; }
    
    .panel{ background: rgba(12,16,35,.62); border:1px solid var(--line); border-radius: 22px; padding:18px; backdrop-filter: blur(16px); }
    .tablewrap{ border-radius: 18px; border:1px solid var(--line); overflow:auto; background: rgba(9,12,28,.35); margin-top: 15px; }
    table{ width:100%; border-collapse:collapse; min-width: 1100px; }
    th, td{ padding: 16px 14px; border-bottom:1px solid rgba(255,255,255,.06); font-size: 13px; text-align: left; }
    th{ color: var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.9px; background: rgba(9,12,28,.92); }
    
    .status-badge { padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
    .bg-vencido { background: rgba(255,59,95,0.2); color: #ff8fa3; }
    .bg-activo { background: rgba(24,201,100,0.2); color: #7ef2ad; }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- TOPBAR CON EL BOTÓN NUEVO -->
    <div class="topbar">
      <div class="brand">
        <div class="logo">SS</div>
        <div class="title">
          <h1>Panel de Clientes</h1>
          <p class="sub">Gestión de suscripciones y renovaciones</p>
        </div>
      </div>

      <div class="top-actions">
        <div>
          <div class="k">Admin key (opcional)</div>
          <input class="input" id="adminKey" type="password" placeholder="Key..." style="width:140px"/>
        </div>

        <!-- BOTÓN PARA IR AL PANEL DE PROVEEDORES -->
        <button class="btn btn-purple" onclick="window.location.href='/proveedores'">
          💳 PROVEEDORES
        </button>

        <button class="btn btn-outline" id="btnReload">Actualizar</button>

        <div style="display:flex; gap:8px;">
          <select id="autoOn" class="input" style="width:110px">
            <option value="on" selected>Auto ON</option>
            <option value="off">Auto OFF</option>
          </select>
          <button class="btn btn-outline" id="btnAutoApply">OK</button>
        </div>
      </div>
    </div>

    <!-- KPIS -->
    <div class="kpis">
      <div class="kpi"><p class="n" id="cActivos">0</p><div class="lbl">Activos</div></div>
      <div class="kpi" style="color:var(--red)"><p class="n" id="cVencidos">0</p><div class="lbl">Vencidos</div></div>
      <div class="kpi"><p class="n" id="cTotal">0</p><div class="lbl">Total</div></div>
    </div>

    <div class="panel">
        <input class="input" id="q" placeholder="🔍 Buscar cliente, correo o servicio..." style="margin-bottom:15px"/>
        
        <div id="status" style="font-size:12px; color:var(--muted); margin-bottom: 10px;">Cargando datos...</div>

        <div class="tablewrap">
            <table>
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Correo</th>
                        <th>Perfil/Pin</th>
                        <th>Cliente</th>
                        <th>Días Rest.</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tb">
                    <!-- Los datos se cargan aquí mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
  </div>

  <script>
    // --- LÓGICA DE JAVASCRIPT ORIGINAL ---
    let allRows = [];

    async function fetchData() {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Actualizando...";
      
      const key = document.getElementById("adminKey").value;

      try {
        const res = await fetch("/api/dashboard", {
          headers: { "x-admin-key": key }
        });
        const data = await res.json();

        if (!data.ok) throw new Error(data.error);

        allRows = data.rows;
        document.getElementById("cActivos").innerText = data.counts.activos;
        document.getElementById("cVencidos").innerText = data.counts.vencidos;
        document.getElementById("cTotal").innerText = data.counts.total;

        render();
        statusEl.innerText = "Última actualización: " + new Date().toLocaleTimeString();
      } catch (e) {
        statusEl.innerText = "Error: " + e.message;
      }
    }

    function render() {
      const q = document.getElementById("q").value.toLowerCase();
      const tbody = document.getElementById("tb");
      tbody.innerHTML = "";

      const filtered = allRows.filter(r => {
        return r.nombre.toLowerCase().includes(q) || 
               r.correo.toLowerCase().includes(q) || 
               r.servicio.toLowerCase().includes(q);
      });

      filtered.forEach(r => {
        const tr = document.createElement("tr");
        const isVencido = r.bucket === "vencidos";

        tr.innerHTML = `
          <td><b>${r.servicio}</b></td>
          <td>${r.correo}</td>
          <td>${r.perfil} / ${r.pin}</td>
          <td>${r.nombre}</td>
          <td style="color: ${isVencido ? 'var(--red)' : 'var(--green)'}">${r.dias}</td>
          <td><span class="status-badge ${isVencido ? 'bg-vencido' : 'bg-activo'}">${r.bucket}</span></td>
          <td>
            <button class="btn btn-outline" style="padding: 5px 10px; font-size: 11px;" onclick="renovar(${r.row})">Renovar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function renovar(row) {
        const key = document.getElementById("adminKey").value;
        const dias = prompt("¿Cuántos días desea sumar?", "30");
        if(!dias) return;

        try {
            const res = await fetch("/api/renovar", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-admin-key": key },
                body: JSON.stringify({ row, dias })
            });
            const data = await res.json();
            if(data.ok) fetchData();
            else alert("Error: " + data.error);
        } catch(e) { alert(e.message); }
    }

    document.getElementById("btnReload").onclick = fetchData;
    document.getElementById("q").oninput = render;

    // Carga inicial
    fetchData();
  </script>
</body>
</html>
