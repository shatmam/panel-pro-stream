<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Streaming Admin</title>

  <style>
    :root{
      --bg0:#070A16; --bg1:#0B1026; --bg2:#0E173A;
      --line: rgba(255,255,255,.10);
      --txt:#F6F8FF; --muted:#B5C0FF;
      --red:#ff3b5f; --green:#18c964; --yellow:#f5b301; --cyan:#23d5f2; --blue:#4f8cff; --purple:#b094ff;
      --shadow: 0 20px 70px rgba(0,0,0,.55); --shadow2: 0 10px 30px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--txt);
      background: radial-gradient(900px 520px at 12% 8%, rgba(79,140,255,.22), transparent 60%), linear-gradient(180deg, var(--bg0), var(--bg1) 40%, var(--bg2));
    }
    .wrap{max-width:1450px; margin:0 auto; padding:20px;}
    .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .logo{ width:45px; height:45px; border-radius:12px; display:grid; place-items:center; font-weight:900; background: linear-gradient(135deg, var(--blue), var(--purple)); }
    
    .input, select{
      padding:10px 14px; border-radius:10px; border:1px solid var(--line);
      background: rgba(10,14,35,.65); color:var(--txt); outline:none;
    }
    .btn{ border:0; cursor:pointer; padding:10px 16px; border-radius:10px; font-weight:800; transition:.1s; }
    .btn-green{ background: var(--green); color:#000; }

    .panel{ background: rgba(12,16,35,.65); border:1px solid var(--line); border-radius: 20px; padding:20px; backdrop-filter: blur(10px); }
    
    .tablewrap{ border-radius: 15px; border:1px solid var(--line); overflow:auto; background: rgba(0,0,0,.2); margin-top:15px;}
    table{ width:100%; border-collapse:collapse; min-width: 1200px; }
    th, td{ padding: 14px; border-bottom:1px solid rgba(255,255,255,.05); text-align: left; font-size:13px; }
    th{ color: var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:1px; }

    .svc{ font-weight:800; color: var(--cyan); }
    .badge-status{ padding:5px 10px; border-radius:8px; font-weight:800; font-size:11px; }
    .badge-status.red{ background: rgba(255,59,95,.15); color:var(--red); }
    .badge-status.green{ background: rgba(24,201,100,.15); color:var(--green); }
    .badge-status.purple{ background: rgba(176,148,255,.15); color:var(--purple); border: 1px solid rgba(176,148,255,0.3); }

    .actions{ display:flex; gap:8px; }
    .a-btn{ border:0; cursor:pointer; padding:8px 12px; border-radius:8px; font-weight:800; font-size:11px; }
    .a-copy{ background: var(--blue); color:#000; }
    .a-del{ background: var(--red); color:#fff; }
    .btn-prov{ background: var(--purple); color:#000; margin-left:5px; font-size:9px; padding:4px 6px; border-radius:5px; }
    
    .mini{ color: var(--muted); font-size:11px; opacity:0.8; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:15px;">
        <div class="logo">SS</div>
        <div><h1 style="margin:0; font-size:20px;">Admin Pro</h1></div>
      </div>
      <div style="display:flex; gap:10px;">
        <input class="input" id="adminKey" type="password" placeholder="Admin Key" style="width:150px">
        <button class="btn btn-green" id="btnReload">🔄</button>
      </div>
    </div>

    <div class="panel">
      <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin-bottom:15px;">
        <input class="input" id="q" placeholder="Buscar cliente o cuenta...">
        <select id="asSvc" class="input"></select>
        <button id="btnAssign" class="btn btn-green">ASIGNAR NUEVO</button>
      </div>

      <div id="status" class="mini">Cargando datos...</div>
      <div id="err" style="color:var(--red); display:none; margin:10px 0;"></div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>SERVICIO</th>
              <th>CUENTA / ACCESO</th>
              <th>CLIENTE</th>
              <th>ESTADO CLIENTE</th>
              <th>DÍAS PROVEEDOR (M)</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRows = [];
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const k = $("adminKey").value;
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type":"application/json", "x-admin-key": k, ...(opts.headers||{}) }
      });
      const data = await res.json().catch(()=> ({}));
      if(!res.ok || data.ok === false) throw new Error(data.error || "Error");
      return data;
    }

    // NUEVA FUNCIÓN PARA RENOVAR TODAS LAS FILAS DE UN CORREO (PROVEEDOR)
    async function renovarProveedor(correo) {
      const dias = prompt(`¿Cuántos días quieres sumar a la cuenta maestra ${correo}?`, "30");
      if(!dias || isNaN(dias)) return;
      
      try {
        $("status").textContent = "Actualizando proveedor...";
        await api("/api/renovar-proveedor", { 
          method: "POST", 
          body: JSON.stringify({ correo, dias: Number(dias) }) 
        });
        alert("✅ Proveedor actualizado en todas las filas con este correo.");
        load();
      } catch(e) { alert("Error: " + e.message); }
    }

    function render() {
      const q = $("q").value.toLowerCase();
      const tb = $("tb");
      tb.innerHTML = "";

      allRows.filter(r => {
        const txt = `${r.servicio} ${r.correo} ${r.nombre}`.toLowerCase();
        return !q || txt.includes(q);
      }).forEach(r => {
        const isDisp = String(r.nombre).toLowerCase() === "disponible";
        const tr = document.createElement("tr");
        
        // Lógica de color para proveedor
        const diasProv = Number(r.fechaProveedor) || 0;
        const provClass = diasProv <= 5 ? 'red' : 'purple';

        tr.innerHTML = `
          <td class="svc">${r.servicio || '—'}</td>
          <td>
            <b>${r.correo || '—'}</b>
            <div class="mini">P: ${r.perfil || '—'} | PIN: ${r.pin || '—'}</div>
          </td>
          <td>${isDisp ? '<i class="mini">Disponible</i>' : `<b>${r.nombre}</b>`}</td>
          <td>
            <span class="badge-status ${r.bucket === 'vencidos' ? 'red' : 'green'}">
              ${r.dias || 0} DÍAS
            </span>
          </td>
          <td>
            <div style="display:flex; align-items:center;">
              <span class="badge-status ${provClass}">
                ${diasProv} DÍAS
              </span>
              <button class="btn-prov" onclick="renovarProveedor('${r.correo}')">RENOVAR</button>
            </div>
          </td>
          <td>
            <div class="actions">
              <button class="a-btn a-copy" onclick="alert('Copiado')">COPIAR</button>
              <button class="a-btn a-del" onclick="liberar(${r.row})">BORRAR</button>
            </div>
          </td>
        `;
        tb.appendChild(tr);
      });
    }

    async function load() {
      try {
        const data = await api("/api/dashboard");
        allRows = data.rows || [];
        render();
        $("status").textContent = `Última actualización: ${new Date().toLocaleTimeString()}`;
      } catch(e) { $("status").textContent = "Error al cargar"; }
    }

    $("btnReload").onclick = load;
    $("q").oninput = render;
    load();
  </script>
</body>
</html>
