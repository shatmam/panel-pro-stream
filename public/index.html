<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Streaming Admin</title>

  <style>
    :root{
      --bg0:#070A16; --bg1:#0B1026; --bg2:#0E173A;
      --line: rgba(255,255,255,.10);
      --txt:#F6F8FF; --muted:#B5C0FF;
      --red:#ff3b5f; --green:#18c964; --yellow:#f5b301; --cyan:#23d5f2; --blue:#4f8cff; --purple:#b094ff;
      --shadow: 0 20px 70px rgba(0,0,0,.55); --shadow2: 0 10px 30px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--txt); background: var(--bg0);}
    .wrap{max-width:1500px; margin:0 auto; padding:22px 18px 70px}
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    .brand{display:flex; align-items:center; gap:14px;}
    .logo{ width:50px; height:50px; border-radius:18px; display:grid; place-items:center; font-weight:1000; background: linear-gradient(135deg, var(--blue), var(--purple)); border:1px solid var(--line); }
    .title h1{margin:0; font-size:22px; line-height:1}
    .title .sub{margin:0; color:var(--muted); font-size:12px}
    .input, select{ width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background: rgba(10,14,35,.65); color:var(--txt); outline:none; }
    .btn{ border:0; cursor:pointer; padding:12px 16px; border-radius:14px; font-weight:900; color:#06101a; background: linear-gradient(135deg, var(--cyan), var(--blue)); }
    .btn-outline{ color:var(--txt); background: rgba(255,255,255,.06); border:1px solid var(--line); }
    .kpis{ display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; margin-bottom:18px; }
    .kpi{ background: rgba(12,16,35,.62); border:1px solid var(--line); border-radius: 22px; padding: 22px 18px; text-align:center; backdrop-filter: blur(16px); }
    .kpi .n{ font-size:44px; font-weight:1000; margin:0; }
    .kpi.red .n{ color: var(--red); }
    .panel{ background: rgba(12,16,35,.62); border:1px solid var(--line); border-radius: 22px; padding:18px; backdrop-filter: blur(16px); }
    .tablewrap{ border-radius: 18px; border:1px solid var(--line); overflow:auto; background: rgba(9,12,28,.35); }
    table{ width:100%; border-collapse:collapse; min-width: 1100px; }
    th, td{ padding: 16px 14px; border-bottom:1px solid rgba(255,255,255,.06); font-size: 13px; vertical-align: middle; }
    th{ color: var(--muted); font-weight:900; text-transform:uppercase; font-size:11px; letter-spacing:.9px; }
    .svc{ font-weight:1000; color: var(--cyan); }
    .badge-status{ display:inline-flex; padding:7px 12px; border-radius: 999px; font-weight:1000; font-size:12px; border:1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.06); }
    .badge-status.red{ background: rgba(255,59,95,.14); color:#ffd5dc; border-color: rgba(255,59,95,.32); }
    .badge-status.green{ background: rgba(24,201,100,.14); color:#d6ffe8; border-color: rgba(24,201,100,.32); }
    .badge-status.purple{ background: rgba(176,148,255,.14); color:#e9eeff; border-color: rgba(176,148,255,.40); }
    .actions{ display:flex; gap:10px; }
    .a-btn{ border:0; cursor:pointer; padding:10px 14px; border-radius: 12px; font-weight:1000; font-size:12px; color:#06101a; }
    .a-copy{ background: var(--cyan); } .a-renew{ background: var(--green); } .a-del{ background: var(--red); color:#fff; }
    .mini{ color: var(--muted); font-size:12px; margin-top: 3px; opacity:0.8; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo">SS</div>
        <div class="title"><h1>Panel de Clientes</h1><p class="sub">Gestión de Cuentas Maestras y Perfiles</p></div>
      </div>
      <div style="display:flex; gap:10px;">
        <input class="input" id="adminKey" type="password" placeholder="Admin Key" style="width:180px">
        <button class="btn btn-outline" id="btnReload">Actualizar</button>
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><p class="n" id="cActivos">0</p><div class="mini">ACTIVOS</div></div>
      <div class="kpi red"><p class="n" id="cVencidos">0</p><div class="mini">VENCIDOS</div></div>
      <div class="kpi"><p class="n" id="cTotal">0</p><div class="mini">TOTAL</div></div>
    </div>

    <div class="panel">
      <div style="margin-bottom:15px; display:flex; gap:10px;">
        <input class="input" id="q" placeholder="Buscar por cliente o correo...">
        <select id="asSvc" class="input" style="width:200px"></select>
      </div>

      <div id="status" class="mini" style="margin-bottom:10px;">Listo.</div>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>SERVICIO</th>
              <th>CUENTA / ACCESO</th>
              <th>CLIENTE</th>
              <th>TELÉFONO</th>
              <th>DÍAS CLIENTE</th>
              <th style="color:var(--purple)">PROVEEDOR (M)</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allRows = [];
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const k = $("adminKey").value;
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type":"application/json", "x-admin-key": k, ...(opts.headers||{}) }
      });
      const data = await res.json().catch(()=> ({}));
      if(!res.ok || data.ok === false) throw new Error(data.error || "Error");
      return data;
    }

    async function renovarProv(correo) {
      const dias = prompt(`Días para la cuenta maestra: ${correo}`, "30");
      if(!dias || isNaN(dias)) return;
      try {
        $("status").textContent = "Actualizando proveedor...";
        await api("/api/renovar-proveedor", { method: "POST", body: JSON.stringify({ correo, dias: Number(dias) }) });
        load(true);
      } catch(e) { alert(e.message); }
    }

    function render() {
      const q = $("q").value.toLowerCase();
      const tb = $("tb");
      tb.innerHTML = "";

      allRows.filter(r => {
        const txt = `${r.servicio} ${r.correo} ${r.nombre}`.toLowerCase();
        return !q || txt.includes(q);
      }).forEach(r => {
        const isDisp = String(r.nombre).toLowerCase() === "disponible";
        
        // Columna M (Proveedor)
        const dProv = parseInt(r.fechaProveedor) || 0;
        const provBadge = `<div style="display:flex; align-items:center; gap:6px;">
          <span class="badge-status ${dProv <= 5 ? 'red' : 'purple'}">${dProv} d</span>
          <button onclick="renovarProv('${r.correo}')" style="background:none; border:none; color:var(--purple); cursor:pointer; font-size:10px;">[RENOVAR]</button>
        </div>`;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="svc">${r.servicio || ""}</td>
          <td>
            <b>${r.correo || ""}</b>
            <div class="mini">P: ${r.perfil || ""} | PIN: ${r.pin || ""}</div>
            <div class="mini">${r.contrasena || ""}</div>
          </td>
          <td>${isDisp ? '<b style="color:var(--muted)">Disponible</b>' : `<b>${r.nombre}</b>`}</td>
          <td>${r.telefono || ""}</td>
          <td><span class="badge-status ${r.bucket === 'vencidos' ? 'red' : 'green'}">${r.dias || 0} DÍAS</span></td>
          <td>${provBadge}</td>
          <td>
            <div class="actions">
              <button class="a-btn a-copy" onclick="console.log('copy')">COPIAR</button>
              <button class="a-btn a-renew" onclick="console.log('ren')">RENOVAR</button>
              <button class="a-btn a-del" onclick="console.log('del')">BORRAR</button>
            </div>
          </td>
        `;
        tb.appendChild(tr);
      });
    }

    async function load(silent = false) {
      if(!silent) $("status").textContent = "Cargando...";
      try {
        const data = await api("/api/dashboard");
        allRows = data.rows || [];
        
        $("cActivos").textContent = allRows.filter(r => r.bucket !== 'vencidos').length;
        $("cVencidos").textContent = allRows.filter(r => r.bucket === 'vencidos').length;
        $("cTotal").textContent = allRows.length;

        render();
        $("status").textContent = "Actualizado.";
      } catch(e) { $("status").textContent = "Error de conexión."; }
    }

    $("btnReload").onclick = () => load();
    $("q").oninput = render;
    load();
  </script>
</body>
</html>
