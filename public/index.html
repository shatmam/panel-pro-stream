<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Streaming Admin</title>

  <style>
    :root{
      --bg0:#070A16; --bg1:#0B1026; --bg2:#0E173A;
      --line: rgba(255,255,255,.10);
      --txt:#F6F8FF; --muted:#B5C0FF;
      --red:#ff3b5f; --green:#18c964; --yellow:#f5b301; --cyan:#23d5f2; --blue:#4f8cff; --purple:#b094ff;
    }

    *{box-sizing:border-box}
    body{
      margin:0; font-family: system-ui, sans-serif; color:var(--txt);
      background: linear-gradient(180deg, var(--bg0), var(--bg1) 40%, var(--bg2));
      min-height: 100vh;
    }

    .wrap{max-width:1400px; margin:0 auto; padding:20px}
    
    .panel{
      background: rgba(12,16,35,.62); border:1px solid var(--line);
      border-radius: 22px; padding:18px; backdrop-filter: blur(16px);
      margin-bottom: 20px;
    }

    .tablewrap{ border-radius: 18px; border:1px solid var(--line); overflow:auto; background: rgba(9,12,28,.35); }
    table{ width:100%; border-collapse:collapse; min-width: 1000px; }
    th, td{ padding: 14px; border-bottom:1px solid rgba(255,255,255,.06); font-size: 13px; text-align: left; }
    th{ color: var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; }

    .input{
      padding:10px; border-radius:10px; border:1px solid var(--line);
      background: rgba(10,14,35,.65); color:var(--txt); outline:none; width: 100%;
    }

    /* SECCIÓN PROVEEDORES */
    .prov-section { margin-top: 40px; border-top: 2px solid var(--line); padding-top: 20px; }
    .prov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
    .prov-item { 
      background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px; 
      display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line);
    }
    .prov-data b { display: block; color: var(--cyan); font-size: 14px; }
    .prov-data span { font-size: 12px; color: var(--muted); }
    .prov-timer { text-align: right; margin-right: 15px; }
    .prov-timer .days { font-size: 20px; font-weight: 800; display: block; }
    .urgent { color: var(--red); }
    
    .btn-renew { 
      background: var(--purple); color: white; border: 0; padding: 8px 12px; 
      border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
    }
    .btn-renew:hover { opacity: 0.8; }
  </style>
</head>

<body>
  <div class="wrap">
    
    <!-- PANEL DE VENTAS (CLIENTES) -->
    <div class="panel">
      <h2>Panel de Ventas</h2>
      <input type="text" id="q" class="input" placeholder="Buscar cliente..." style="margin-bottom:15px;">
      
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Servicio</th>
              <th>Cuenta</th>
              <th>Cliente</th>
              <th>Días</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>

    <!-- SECCIÓN DE PROVEEDORES (CORREOS Y DÍAS) -->
    <div class="prov-section">
      <h2 style="color: var(--purple)">Vencimientos con Proveedor</h2>
      <div id="provGrid" class="prov-grid"></div>
    </div>

  </div>

  <script>
    let allRows = [];
    const $ = (id) => document.getElementById(id);

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { "Content-Type": "application/json" }
      });
      return res.json();
    }

    async function load() {
      try {
        const data = await api("/api/dashboard");
        allRows = data.rows || [];
        render();
        renderProveedores();
      } catch(e) { console.error("Error cargando datos", e); }
    }

    function render() {
      const q = $("q").value.toLowerCase();
      const tb = $("tb");
      tb.innerHTML = "";

      allRows.filter(r => !r.nombre?.toLowerCase().includes("disponible") && (r.nombre+r.correo).toLowerCase().includes(q))
      .forEach(r => {
        tb.innerHTML += `
          <tr>
            <td><b style="color:var(--cyan)">${r.servicio}</b></td>
            <td>${r.correo}</td>
            <td><b>${r.nombre}</b></td>
            <td><b style="color:${r.dias <= 5 ? 'var(--red)' : 'var(--green)'}">${r.dias}</b></td>
          </tr>`;
      });
    }

    function renderProveedores() {
      const grid = $("provGrid");
      grid.innerHTML = "";

      // Filtramos solo las filas que tengan un correo (para no mostrar basura)
      allRows.forEach(r => {
        if (!r.correo) return;

        const dias = Number(r.dias || 0);
        const isUrgent = dias <= 3;

        grid.innerHTML += `
          <div class="prov-item">
            <div class="prov-data">
              <b>${r.correo}</b>
              <span>Servicio: ${r.servicio}</span>
            </div>
            <div class="prov-timer">
              <span class="days ${isUrgent ? 'urgent' : ''}">${dias}d</span>
              <span style="font-size:10px; color:var(--muted)">Restantes</span>
            </div>
            <button class="btn-renew" onclick="renovarProveedor(${r.row})">
              RENOVAR
            </button>
          </div>`;
      });
    }

    async function renovarProveedor(row) {
      const dias = prompt("¿Cuántos días quieres añadir a esta cuenta del proveedor?", "30");
      if (!dias) return;

      try {
        await api("/api/renovar", { 
          method: "POST", 
          body: JSON.stringify({ row, dias: parseInt(dias) }) 
        });
        alert("Cuenta renovada correctamente");
        load();
      } catch(e) { alert("Error al renovar"); }
    }

    $("q").oninput = render;
    load();
    setInterval(load, 30000); // Auto-actualizar cada 30 segundos
  </script>
</body>
</html>
