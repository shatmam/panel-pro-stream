<script>
const form = document.getElementById('payForm');
const tbody = document.getElementById('pagoRows');

async function loadPagos() {
  const res = await fetch('/api/pagos');
  const data = await res.json();

  const pagos = data.data || [];

  tbody.innerHTML = pagos.map(p => `
    <tr>
      <td>${p.proveedor}</td>
      <td>${p.servicio}</td>
      <td>$${p.monto}</td>
      <td>${p.fecha}</td>
      <td>${p.estado}</td>
    </tr>
  `).join("");
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    proveedor: pName.value,
    servicio: pSvc.value,
    monto: pAmount.value,
    fecha: pDate.value
  };

  await fetch('/api/pagos/add', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });

  alert("Guardado");
  form.reset();
  loadPagos();
});

loadPagos();
</script>
