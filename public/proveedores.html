<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel Proveedores | Finanzas</title>

  <style>
    :root{
      --bg0:#0A0516;
      --bg1:#0F0B26;
      --bg2:#140E3A;
      --line: rgba(255,255,255,.08);
      --txt:#F6F8FF;
      --muted:#B5C0FF;
      --purple:#b094ff;
      --pink:#ff7eb6;
      --green:#18c964;
      --yellow:#f5b301;
      --shadow: 0 20px 70px rgba(0,0,0,.6);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, sans-serif;
      color:var(--txt);
      background: 
        radial-gradient(800px 500px at 90% 10%, rgba(176,148,255,.15), transparent 70%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100vh;
    }

    .wrap{max-width:1200px; margin:0 auto; padding:25px 20px;}

    /* Header */
    .header{
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:30px; flex-wrap:wrap; gap:15px;
    }
    .back-btn{
      text-decoration:none; color:var(--purple); font-weight:800;
      padding:10px 18px; border-radius:12px; border:1px solid var(--purple);
      background: rgba(176,148,255,0.05); transition:.2s;
    }
    .back-btn:hover{ background: var(--purple); color:var(--bg0); }

    /* Stats */
    .stats-grid{
      display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap:20px; margin-bottom:30px;
    }
    .stat-card{
      background: rgba(255,255,255,0.03); border:1px solid var(--line);
      padding:25px; border-radius:20px; backdrop-filter:blur(10px);
    }
    .stat-card h3{ margin:0; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
    .stat-card p{ margin:10px 0 0; font-size:32px; font-weight:900; color:var(--purple); }

    /* Main Grid */
    .main-grid{ display:grid; grid-template-columns: 1fr 350px; gap:25px; }
    @media (max-width: 900px){ .main-grid{ grid-template-columns: 1fr; } }

    .card{
      background: rgba(12,16,35,.6); border:1px solid var(--line);
      border-radius:22px; padding:20px; box-shadow: var(--shadow);
    }
    .card-title{ font-weight:900; font-size:18px; margin-bottom:20px; display:flex; align-items:center; gap:10px; }

    /* Form */
    .form-group{ margin-bottom:15px; }
    .form-group label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    .input{
      width:100%; padding:12px; border-radius:12px; border:1px solid var(--line);
      background: rgba(0,0,0,0.2); color:white; outline:none;
    }
    .btn-pay{
      width:100%; padding:14px; border-radius:12px; border:0;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      color:white; font-weight:900; cursor:pointer; margin-top:10px;
    }

    /* Table */
    .table-ui{ width:100%; border-collapse:collapse; font-size:14px; }
    .table-ui th{ text-align:left; padding:12px; color:var(--muted); font-size:11px; border-bottom:1px solid var(--line); }
    .table-ui td{ padding:15px 12px; border-bottom:1px solid rgba(255,255,255,0.03); }
    
    .status-pill{
      padding:4px 10px; border-radius:20px; font-size:11px; font-weight:bold;
    }
    .pending{ background:rgba(245,179,1,0.15); color:var(--yellow); }
    .paid{ background:rgba(24,201,100,0.15); color:var(--green); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <h1 style="margin:0; font-size:28px;">💳 Gestión de Proveedores</h1>
      <p style="color:var(--muted); margin:5px 0 0;">Control de cuentas mayoristas y fechas de pago</p>
    </div>
    <a href="index.html" class="back-btn">⬅ VOLVER A VENTAS</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <h3>Próximo Vencimiento</h3>
      <p id="nextDate">-- / --</p>
    </div>
    <div class="stat-card">
      <h3>Total por Pagar (Mes)</h3>
      <p id="totalMonth">$0.00</p>
    </div>
    <div class="stat-card">
      <h3>Proveedores Activos</h3>
      <p id="activeProv">0</p>
    </div>
  </div>

  <div class="main-grid">
    <!-- Tabla de Pagos -->
    <div class="card">
      <div class="card-title">📅 Calendario de Pagos</div>
      <div style="overflow-x:auto;">
        <table class="table-ui">
          <thead>
            <tr>
              <th>PROVEEDOR</th>
              <th>SERVICIO / PACK</th>
              <th>MONTO</th>
              <th>FECHA PAGO</th>
              <th>ESTADO</th>
            </tr>
          </thead>
          <tbody id="pagoRows">
            <!-- Los datos cargarán aquí -->
            <tr>
              <td colspan="5" style="text-align:center; padding:40px; color:var(--muted);">Cargando cronograma...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulario de Registro -->
    <div class="card">
      <div class="card-title">📝 Registrar Gasto</div>
      <form id="payForm">
        <div class="form-group">
          <label>Proveedor</label>
          <input type="text" class="input" id="pName" placeholder="Ej: Juan Mayorista" required>
        </div>
        <div class="form-group">
          <label>Concepto / Servicio</label>
          <input type="text" class="input" id="pSvc" placeholder="Ej: 50 Cuentas Netflix" required>
        </div>
        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" class="input" id="pAmount" placeholder="0.00" required>
        </div>
        <div class="form-group">
          <label>Fecha de Vencimiento</label>
          <input type="date" class="input" id="pDate" required>
        </div>
        <button type="submit" class="btn-pay">REGISTRAR PAGO</button>
      </form>
    </div>
  </div>
</div>

<script>
  // Aquí puedes agregar la lógica para conectar con tu API de Google Sheets
  // Similar a como manejas el index.html
  
  const form = document.getElementById('payForm');
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.innerText = "PROCESANDO...";
    btn.disabled = true;

    const data = {
      proveedor: document.getElementById('pName').value,
      servicio: document.getElementById('pSvc').value,
      monto: document.getElementById('pAmount').value,
      fecha: document.getElementById('pDate').value
    };

    // Ejemplo de envío (deberás crear esta ruta en tu server.js)
    /*
    try {
      const res = await fetch('/api/proveedores/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if(res.ok) {
        alert("Pago registrado correctamente");
        location.reload();
      }
    } catch (err) {
      alert("Error al registrar");
    }
    */
    
    setTimeout(() => {
      alert("Función conectada: Pago registrado (Simulado)");
      btn.innerText = "REGISTRAR PAGO";
      btn.disabled = false;
    }, 1000);
  });
</script>

</body>
</html>
